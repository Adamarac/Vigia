[project]
name = "vigia"
version = "0.1.0"
description = "Lê a cor de regiões da tela (janela do RDP) e avisa no Telegram quando o estado muda. Não captura nem grava imagens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "tomli-w>=1.0",
    "mss>=9.0",
]

[project.scripts]
vigia = "vigia.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# N818: o código é em português; as exceções usam o prefixo "Erro", equivalente a "Error".
ignore = ["N818"]
